
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 900 290"
     width="900" height="290">

  <defs>
    <!-- Main border -->
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#BF00FF"/>
      <stop offset="50%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#BF00FF"/>
    </linearGradient>

    <!-- Background -->
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090414"/>
      <stop offset="45%" stop-color="#170826"/>
      <stop offset="100%" stop-color="#080310"/>
    </linearGradient>

    <!-- Animated text -->
    <linearGradient id="value"
                    gradientUnits="userSpaceOnUse"
                    x1="250" y1="0"
                    x2="620" y2="0"
                    spreadMethod="repeat">
      <stop offset="0%" stop-color="#F5D0FE"/>
      <stop offset="33%" stop-color="#BF00FF"/>
      <stop offset="66%" stop-color="#8B00FF"/>
      <stop offset="100%" stop-color="#F5D0FE"/>
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="0 0" to="370 0"
        dur="6s"
        repeatCount="indefinite"/>
    </linearGradient>

    <!-- Purple nebula -->
    <radialGradient id="nebula">
      <stop offset="0%" stop-color="#8B00FF" stop-opacity=".38"/>
      <stop offset="50%" stop-color="#6D28D9" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>

    <!-- Meteor trail: tail behind falling head -->
    <linearGradient id="trail"
                    gradientUnits="userSpaceOnUse"
                    x1="-115" y1="-115"
                    x2="0" y2="0">
      <stop offset="0%" stop-color="#8B00FF" stop-opacity="0"/>
      <stop offset="35%" stop-color="#8B00FF" stop-opacity=".25"/>
      <stop offset="70%" stop-color="#BF00FF" stop-opacity=".75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity=".95"/>
    </linearGradient>

    <!-- Meteor core -->
    <linearGradient id="core"
                    gradientUnits="userSpaceOnUse"
                    x1="-115" y1="-115"
                    x2="0" y2="0">
      <stop offset="0%" stop-color="#BF00FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D8B4FE" stop-opacity=".4"/>
      <stop offset="85%" stop-color="#F5D0FE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Meteor head -->
    <radialGradient id="head">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F5D0FE"/>
      <stop offset="55%" stop-color="#BF00FF" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#BF00FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="blur">
      <feGaussianBlur stdDeviation="7"/>
    </filter>

    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>

    <!-- Card clipping -->
    <clipPath id="card">
      <rect x="21" y="11"
            width="858" height="268" rx="15"/>
    </clipPath>

    <!-- Premium meteor -->
    <g id="meteor">
      <!-- Wide atmospheric trail -->
      <path d="M -115 -115 L 0 0"
            fill="none"
            stroke="url(#trail)"
            stroke-width="9"
            stroke-linecap="round"
            filter="url(#soft)"
            opacity=".65"/>

      <!-- Sharp light streak -->
      <path d="M -115 -115 L 0 0"
            fill="none"
            stroke="url(#core)"
            stroke-width="1.8"
            stroke-linecap="round"/>

      <!-- Glowing head -->
      <circle r="11" fill="url(#head)"/>
      <circle r="2.3" fill="#FFFFFF"/>
    </g>

    <!-- Small distant meteor -->
    <g id="smallMeteor">
      <path d="M -65 -65 L 0 0"
            stroke="url(#trail)"
            stroke-width="3"
            stroke-linecap="round"
            fill="none"/>
      <path d="M -65 -65 L 0 0"
            stroke="url(#core)"
            stroke-width=".8"
            fill="none"/>
      <circle r="1.5" fill="#E9D5FF"/>
    </g>

    <!-- Star -->
    <circle id="star" r="1" fill="#E9D5FF"/>
  </defs>

  <!-- Outer border glow -->
  <rect x="20" y="10"
        width="860" height="270" rx="16"
        fill="none"
        stroke="#BF00FF"
        stroke-width="4"
        opacity=".4"
        filter="url(#blur)"/>

  <!-- Main card -->
  <rect x="20" y="10"
        width="860" height="270" rx="16"
        fill="url(#space)"
        stroke="url(#border)"
        stroke-width="1.5"/>

  <!-- Entire animated background -->
  <g clip-path="url(#card)">

    <!-- Nebula clouds -->
    <ellipse cx="650" cy="130"
             rx="340" ry="180"
             fill="url(#nebula)"/>

    <ellipse cx="220" cy="250"
             rx="300" ry="140"
             fill="url(#nebula)"
             opacity=".5"/>

    <!-- Static distant stars -->
    <g opacity=".6">
      <use href="#star" x="80" y="80"/>
      <use href="#star" x="140" y="190"/>
      <use href="#star" x="210" y="65"/>
      <use href="#star" x="300" y="245"/>
      <use href="#star" x="360" y="80"/>
      <use href="#star" x="410" y="200"/>
      <use href="#star" x="470" y="65"/>
      <use href="#star" x="520" y="245"/>
      <use href="#star" x="590" y="90"/>
      <use href="#star" x="640" y="195"/>
      <use href="#star" x="700" y="60"/>
      <use href="#star" x="750" y="250"/>
      <use href="#star" x="810" y="100"/>
      <use href="#star" x="850" y="220"/>
    </g>

    <!-- Twinkling stars -->
    <g fill="#F5D0FE">
      <circle cx="120" cy="115" r="1.4">
        <animate attributeName="opacity"
                 values=".1;1;.1" dur="3.2s"
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="480" cy="155" r="1.2">
        <animate attributeName="opacity"
                 values="1;.1;1" dur="4.4s"
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="775" cy="75" r="1.5">
        <animate attributeName="opacity"
                 values=".2;1;.2" dur="2.8s"
                 repeatCount="indefinite"/>
      </circle>
      <circle cx="680" cy="260" r="1.1">
        <animate attributeName="opacity"
                 values="1;.2;1" dur="3.7s"
                 repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- METEOR SHOWER -->
    <!-- Movement uses continuous falling paths -->

    <!-- Meteor 1 -->
    <g opacity=".8">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="-80,-80;460,460"
                        dur="5.5s"
                        repeatCount="indefinite"/>
      <use href="#meteor"/>
    </g>

    <!-- Meteor 2 -->
    <g opacity=".65">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="160,-130;640,350"
                        dur="4.7s"
                        begin="-2s"
                        repeatCount="indefinite"/>
      <use href="#meteor" transform="scale(.7)"/>
    </g>

    <!-- Meteor 3 -->
    <g opacity=".85">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="350,-100;830,380"
                        dur="6.2s"
                        begin="-4s"
                        repeatCount="indefinite"/>
      <use href="#meteor" transform="scale(.9)"/>
    </g>

    <!-- Meteor 4 -->
    <g opacity=".7">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="550,-150;990,290"
                        dur="5.1s"
                        begin="-1.5s"
                        repeatCount="indefinite"/>
      <use href="#meteor" transform="scale(.65)"/>
    </g>

    <!-- Meteor 5 -->
    <g opacity=".9">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="700,-100;1060,260"
                        dur="4.2s"
                        begin="-3s"
                        repeatCount="indefinite"/>
      <use href="#meteor" transform="scale(.8)"/>
    </g>

    <!-- Meteor 6 -->
    <g opacity=".45">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="-150,30;250,430"
                        dur="7.3s"
                        begin="-5s"
                        repeatCount="indefinite"/>
      <use href="#smallMeteor"/>
    </g>

    <!-- Meteor 7 -->
    <g opacity=".5">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="100,-100;460,260"
                        dur="3.8s"
                        begin="-1s"
                        repeatCount="indefinite"/>
      <use href="#smallMeteor"/>
    </g>

    <!-- Meteor 8 -->
    <g opacity=".65">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="300,-120;750,330"
                        dur="5.8s"
                        begin="-4.5s"
                        repeatCount="indefinite"/>
      <use href="#smallMeteor"/>
    </g>

    <!-- Meteor 9 -->
    <g opacity=".55">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="480,-80;850,290"
                        dur="4.4s"
                        begin="-2.7s"
                        repeatCount="indefinite"/>
      <use href="#smallMeteor"/>
    </g>

    <!-- Meteor 10 -->
    <g opacity=".65">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="620,-130;1020,270"
                        dur="6.5s"
                        begin="-3.8s"
                        repeatCount="indefinite"/>
      <use href="#smallMeteor"/>
    </g>

    <!-- Meteor 11 -->
    <g opacity=".4">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="-40,-150;350,240"
                        dur="5s"
                        begin="-2.4s"
                        repeatCount="indefinite"/>
      <use href="#smallMeteor" transform="scale(.65)"/>
    </g>

    <!-- Meteor 12 -->
    <g opacity=".5">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="760,-120;1120,240"
                        dur="4.9s"
                        begin="-1.8s"
                        repeatCount="indefinite"/>
      <use href="#smallMeteor"/>
    </g>

    <!-- Dark translucent reading layer -->
    <rect x="20" y="50"
          width="860" height="230"
          fill="#0B0612"
          opacity=".35"/>

  </g>

  <!-- Terminal header -->
  <rect x="21" y="11"
        width="858" height="39"
        fill="#10061E" opacity=".9"/>

  <line x1="20" y1="50"
        x2="880" y2="50"
        stroke="#7C3AED" opacity=".6"/>

  <circle cx="50" cy="30" r="6" fill="#BF00FF"/>
  <circle cx="72" cy="30" r="6" fill="#8B00FF"/>
  <circle cx="94" cy="30" r="6" fill="#6D28D9"/>

  <text x="120" y="35"
        font-family="Courier New, monospace"
        font-size="14" fill="#A78BFA">
    diavalga@void:~$ cat about.txt
  </text>

  <!-- Information -->
  <g font-family="Courier New, monospace" font-size="18">

    <text x="60" y="100" fill="#A78BFA">Education</text>
    <text x="250" y="100" fill="url(#value)">Universitas Negeri Semarang</text>

    <text x="60" y="138" fill="#A78BFA">Major</text>
    <text x="250" y="138" fill="url(#value)">Information Systems</text>

    <text x="60" y="176" fill="#A78BFA">Focus</text>
    <text x="250" y="176" fill="url(#value)">AI Engineering / Machine Learning</text>

    <text x="60" y="214" fill="#A78BFA">Languages</text>
    <text x="250" y="214" fill="url(#value)">Python, C++, C#</text>

    <text x="60" y="252" fill="#A78BFA">Environment</text>
    <text x="250" y="252" fill="url(#value)">Linux</text>

  </g>

  <!-- Blinking cursor -->
  <rect x="312" y="238"
        width="10" height="18"
        fill="#BF00FF">
    <animate attributeName="opacity"
             values="1;0;1"
             dur="1.2s"
             calcMode="discrete"
             repeatCount="indefinite"/>
  </rect>

</svg>
